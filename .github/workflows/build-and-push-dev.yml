name: Build and Push Docker Image to ECR

on:
  push:
    branches: dev
    paths-ignore:
      - "Docs/**"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: http
            dockerfile: Dockerfile.lambda.http
            cache_scope: http
          - name: sqs
            dockerfile: Dockerfile.lambda.sqs
            cache_scope: sqs

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.target.name }} image to Amazon ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ matrix.target.name }}-dev-${{ github.run_number }}
          cache-from: type=gha,scope=${{ github.ref }}-${{ matrix.target.cache_scope }}
          cache-to: type=gha,scope=${{ github.ref }}-${{ matrix.target.cache_scope }},mode=max
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.2"

      - name: Deploy Dev Environment
        run: |
          cd terraform/dev
          terraform init
          terraform apply -auto-approve \
            -var="lambda_image_uri_http=${{ secrets.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:http-dev-${{ github.run_number }}" \
            -var="lambda_image_uri_sqs=${{ secrets.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:sqs-dev-${{ github.run_number }}"
