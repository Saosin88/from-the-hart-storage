[package]
name = "from-the-hart-storage"
version = "0.1.0"
edition = "2021"
default-run = "from-the-hart-storage" 

[dependencies]
axum = "0.8.6"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
lambda_http = "0.17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
config = "0.15"
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-error = "0.2"
aide = { version = "0.15.1", features = ["axum", "swagger", "axum-json"] }
schemars = "0.9"
thiserror = "2.0.17"
lambda_runtime = "0.14.4"
aws_lambda_events = "0.18.0"
aws-config = "1.5.17"
aws-sdk-s3 = "1.69.0"
imagesize = "0.14.0"
kamadak-exif = "0.6.1"
chrono = "0.4"
async-trait = "0.1"
urlencoding = "2.1"

[dev-dependencies]
axum-test = "18.2"
serde_json = "1.0"

[lib]
name = "from_the_hart_storage"
path = "src/lib.rs"

[[bin]]
name = "from-the-hart-storage"
path = "src/main.rs"

[[bin]]
name = "bootstrap"
path = "src/lambda.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
