[package]
name = "from-the-hart-storage"
version = "0.1.0"
edition = "2021"
default-run = "from-the-hart-storage" 

[dependencies]
axum = "0.8.6"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
lambda_http = "0.17.0"
serde = { version = "1.0", features = ["derive"] }
config = "0.15"
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
once_cell = "1.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aide = { version = "0.15.1", features = ["axum", "swagger", "axum-json"] }
schemars = "0.9"

[lib]
name = "from_the_hart_storage"
path = "src/lib.rs"

[[bin]]
name = "from-the-hart-storage"
path = "src/main.rs"

[[bin]]
name = "bootstrap"
path = "src/lambda.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
