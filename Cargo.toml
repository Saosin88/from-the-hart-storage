[package]
name = "from-the-hart-storage"
version = "0.1.0"
edition = "2021"

[features]
default = ["http", "sqs"]
http = ["axum", "tower", "tower-http", "lambda_http", "aide", "schemars"]
sqs = ["lambda_runtime", "aws_lambda_events", "imagesize", "kamadak-exif"]

[dependencies]
# HTTP-specific dependencies
axum = { version = "=0.8.7", optional = true }
tower = { version = "=0.5.2", optional = true }
tower-http = { version = "=0.6.7", features = ["trace"], optional = true }
lambda_http = { version = "=1.0.1", optional = true }
aide = { version = "=0.16.0-alpha.1", features = ["axum", "swagger", "axum-json"], optional = true }
schemars = { version = "=1.1.0", optional = true }

# SQS-specific dependencies
lambda_runtime = { version = "=1.0.1", optional = true }
aws_lambda_events = { version = "=1.0.1", optional = true }
imagesize = { version = "=0.14.0", optional = true }
kamadak-exif = { version = "=0.6.1", optional = true }

# Core dependencies (always included)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "=0.15.19"
dotenvy = "=0.15.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-error = "0.2"
thiserror = "2"
anyhow = "1"
aws-config = "=1.8.11"  # pinned: new versions require Rust 1.91.1
aws-sdk-s3 = "=1.115.0"  # pinned: new versions require Rust 1.91.1
chrono = { version = "=0.4.42", features = ["serde"] }
chrono-tz = "=0.10.4"
async-trait = "0.1"
urlencoding = "2"
aws-sdk-dynamodb = "=1.98.0"  # pinned: new versions require Rust 1.91.1
aws-sdk-ssm = "=1.98.0"  # pinned: new versions require Rust 1.91.1
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
jsonwebtoken = { version = "=10.2.0", features = ["rust_crypto"] }
rsa = { version = "=0.9", features = ["sha1"] }

[dev-dependencies]
axum-test = "=18.3.0"
serde_json = "1.0"

[lib]
name = "from_the_hart_storage"
path = "src/lib.rs"

[[bin]]
name = "from-the-hart-storage"
path = "src/main.rs"
required-features = ["http"]

[[bin]]
name = "bootstrap_http"
path = "src/bin/bootstrap_http.rs"
required-features = ["http"]

[[bin]]
name = "bootstrap_sqs"
path = "src/bin/bootstrap_sqs.rs"
required-features = ["sqs"]


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
