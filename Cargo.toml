[package]
name = "from-the-hart-storage"
version = "0.1.0"
edition = "2021"
default-run = "from-the-hart-storage" 

[features]
default = ["http", "sqs"]
http = ["axum", "tower", "tower-http", "lambda_http", "aide", "schemars"]
sqs = ["lambda_runtime", "aws_lambda_events", "imagesize", "kamadak-exif"]

[dependencies]
# HTTP-specific dependencies
axum = { version = "0.8.6", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
lambda_http = { version = "0.17.0", optional = true }
aide = { version = "0.15.1", features = ["axum", "swagger", "axum-json"], optional = true }
schemars = { version = "0.9", optional = true }

# SQS-specific dependencies
lambda_runtime = { version = "0.14.4", optional = true }
aws_lambda_events = { version = "0.18.0", optional = true }
imagesize = { version = "0.14.0", optional = true }
kamadak-exif = { version = "0.6.1", optional = true }

# Core dependencies (always included)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
config = "0.15"
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-error = "0.2"
thiserror = "2.0.17"
aws-config = "1.5.17"
aws-sdk-s3 = "1.69.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
async-trait = "0.1"
urlencoding = "2.1"
aws-sdk-dynamodb = "1.98.0"
sha2 = "0.10.9"

[dev-dependencies]
axum-test = "18.2"
serde_json = "1.0"

[lib]
name = "from_the_hart_storage"
path = "src/lib.rs"

[[bin]]
name = "from-the-hart-storage"
path = "src/main.rs"
required-features = ["http"]

[[bin]]
name = "bootstrap-http"
path = "src/lambda_http.rs"
required-features = ["http"]

[[bin]]
name = "bootstrap-sqs"
path = "src/lambda_sqs.rs"
required-features = ["sqs"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
