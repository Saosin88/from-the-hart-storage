[package]
name = "from-the-hart-storage"
version = "0.1.0"
edition = "2024"

[features]
default = ["http", "sqs"]
http = ["axum", "tower", "tower-http", "lambda_http", "aide", "schemars"]
sqs = ["lambda_runtime", "aws_lambda_events", "imagesize", "kamadak-exif"]

[dependencies]
# HTTP-specific dependencies
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
lambda_http = { version = "1", optional = true }
aide = { version = "0.16.0-alpha.4", features = ["axum", "swagger", "axum-json"], optional = true }  # stays on alpha because latest stable (0.15.1) requires schemars 0.9, incompatible with our schemars 1.x
schemars = { version = "1", optional = true }

# SQS-specific dependencies
lambda_runtime = { version = "1", optional = true }
aws_lambda_events = { version = "1", optional = true }
imagesize = { version = "0.14", optional = true }
kamadak-exif = { version = "0.6", optional = true }

# Core dependencies (always included)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-error = "0.2"
thiserror = "2"
anyhow = "1"
aws-config = "1"
aws-sdk-s3 = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
async-trait = "0.1"
urlencoding = "2"
aws-sdk-dynamodb = "1"
aws-sdk-ssm = "1"
sha1 = "0.10"  # pinned: rsa 0.9.x depends on digest 0.10; sha1 0.11 uses digest 0.11 which is incompatible with rsa's SigningKey<Sha1>
indexmap = "2"
sha2 = "0.11"
base64 = "0.22"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rsa = { version = "0.9", features = ["sha1"] }

[dev-dependencies]
axum-test = "20"
serde_json = "1.0"

[lib]
name = "from_the_hart_storage"
path = "src/lib.rs"

[[bin]]
name = "from-the-hart-storage"
path = "src/main.rs"
required-features = ["http"]

[[bin]]
name = "bootstrap_http"
path = "src/bin/bootstrap_http.rs"
required-features = ["http"]

[[bin]]
name = "bootstrap_sqs"
path = "src/bin/bootstrap_sqs.rs"
required-features = ["sqs"]


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 8

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
must_use_candidate = "warn"
clone_on_ref_ptr = "warn"
redundant_closure_for_method_calls = "warn"
